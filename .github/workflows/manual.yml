name: NIGHT//CAST Watch Deck

on:
  schedule:
    - cron: '*/20 * * * *'   # ogni 20 minuti
  workflow_dispatch:          # permette avvio manuale da GitHub

permissions:
  contents: write

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache per titolo visti
        id: cache
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Installa dipendenze
        run: pip install feedparser requests

      - name: Scarica feed e invia notizie nuove
        run: python3 .github/scripts/push_news.py
